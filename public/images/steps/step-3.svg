<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wash3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <radialGradient id="lemonGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e0b93f" />
      <stop offset="70%" stop-color="#c99a2e" />
      <stop offset="100%" stop-color="#a3272c" stop-opacity="0.55" />
    </radialGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99a2e" />
      <stop offset="100%" stop-color="#9a4a2b" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#f4ecd8" />

  <!-- background wash, same as step 2 -->
  <ellipse cx="140" cy="90" rx="230" ry="120" fill="#2c4a8a" opacity="0.5" filter="url(#wash3)" />
  <ellipse cx="300" cy="150" rx="170" ry="100" fill="#9a4a2b" opacity="0.35" filter="url(#wash3)" />

  <line x1="10" y1="232" x2="390" y2="232" stroke="#b9ab8a" stroke-width="2" opacity="0.8" />

  <!-- cloth with local color -->
  <path d="M42,232 L42,184 L114,160 L174,192 L174,232 Z" fill="url(#clothGrad)" filter="url(#soft3)" />
  <path d="M94,174 L136,204" fill="none" stroke="#6b3f22" stroke-width="1.5" opacity="0.5" />

  <!-- mug with local color -->
  <rect x="230" y="150" width="72" height="70" rx="12" fill="#2c4a8a" filter="url(#soft3)" />
  <ellipse cx="266" cy="150" rx="36" ry="12" fill="#3a5a9a" filter="url(#soft3)" />
  <path d="M302,166 q24,10 0,36" fill="none" stroke="#2c4a8a" stroke-width="5" opacity="0.85" />

  <!-- lemon with local color -->
  <ellipse cx="174" cy="197" rx="46" ry="33" fill="url(#lemonGrad)" filter="url(#soft3)" />

  <text x="200" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5c3a21">color while the paper is still damp</text>
</svg>
