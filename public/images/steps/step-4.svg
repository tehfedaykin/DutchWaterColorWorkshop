<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wash4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <radialGradient id="lemonGrad4" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e0b93f" />
      <stop offset="70%" stop-color="#c99a2e" />
      <stop offset="100%" stop-color="#a3272c" stop-opacity="0.55" />
    </radialGradient>
    <linearGradient id="clothGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99a2e" />
      <stop offset="100%" stop-color="#9a4a2b" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#f4ecd8" />

  <ellipse cx="140" cy="90" rx="230" ry="120" fill="#2c4a8a" opacity="0.5" filter="url(#wash4)" />
  <ellipse cx="300" cy="150" rx="170" ry="100" fill="#9a4a2b" opacity="0.35" filter="url(#wash4)" />

  <line x1="10" y1="232" x2="390" y2="232" stroke="#2b1d12" stroke-width="3" opacity="0.55" />

  <!-- cast shadow on table -->
  <ellipse cx="210" cy="238" rx="140" ry="12" fill="#2b1d12" opacity="0.3" />

  <path d="M42,232 L42,184 L114,160 L174,192 L174,232 Z" fill="url(#clothGrad4)" filter="url(#soft4)" />
  <path d="M94,174 L136,204" fill="none" stroke="#2b1d12" stroke-width="2" opacity="0.4" />
  <!-- one dark on the shaded fold of the cloth -->
  <path d="M136,204 L174,192 L174,232 L150,232 Z" fill="#2b1d12" opacity="0.35" filter="url(#soft4)" />

  <rect x="230" y="150" width="72" height="70" rx="12" fill="#2c4a8a" filter="url(#soft4)" />
  <ellipse cx="266" cy="150" rx="36" ry="12" fill="#3a5a9a" filter="url(#soft4)" />
  <path d="M302,166 q24,10 0,36" fill="none" stroke="#2c4a8a" stroke-width="5" opacity="0.85" />
  <!-- shaded right side of mug -->
  <path d="M266,150 a36,12 0 0 0 0,0 L302,150 L302,220 L266,220 Z" fill="#2b1d12" opacity="0.28" filter="url(#soft4)" />

  <ellipse cx="174" cy="197" rx="46" ry="33" fill="url(#lemonGrad4)" filter="url(#soft4)" />
  <!-- one dark: shadow lobe on the lemon's shaded side -->
  <path d="M186,168 A46,33 0 0 1 200,222 A30,20 0 0 0 186,168 Z" fill="#2b1d12" opacity="0.4" filter="url(#soft4)" />

  <text x="200" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5c3a21">one confident dark, and the light feels real</text>
</svg>
