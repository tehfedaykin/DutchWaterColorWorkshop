<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wash" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f4ecd8" />

  <!-- big wet wash bleeding across the background -->
  <ellipse cx="140" cy="90" rx="230" ry="120" fill="#2c4a8a" opacity="0.5" filter="url(#wash)" />
  <ellipse cx="300" cy="150" rx="170" ry="100" fill="#9a4a2b" opacity="0.4" filter="url(#wash)" />
  <ellipse cx="220" cy="60" rx="140" ry="70" fill="#2c4a8a" opacity="0.25" filter="url(#wash)" />

  <!-- table line -->
  <line x1="10" y1="232" x2="390" y2="232" stroke="#b9ab8a" stroke-width="2" opacity="0.8" />

  <!-- faint pencil map still visible underneath -->
  <g opacity="0.45">
    <path d="M42,232 L42,184 L114,160 L174,192 L174,232 Z" fill="none" stroke="#5c3a21" stroke-width="2" />
    <ellipse cx="174" cy="197" rx="46" ry="33" fill="none" stroke="#5c3a21" stroke-width="2" />
    <rect x="230" y="150" width="72" height="70" rx="12" fill="none" stroke="#5c3a21" stroke-width="2" />
    <ellipse cx="266" cy="150" rx="36" ry="12" fill="none" stroke="#5c3a21" stroke-width="2" />
  </g>

  <text x="200" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5c3a21" opacity="0.75">water first, then a little pigment</text>
</svg>
